<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Harbour Coast RP | Ticket #13
</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background:
        #313338;

    color:
        #dbdee1;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/*
=================================
HEADER
=================================
*/

header {
    background:
        #1e1f22;

    padding:
        30px;

    border-bottom:
        1px solid #3f4147;
}


.header-inner {
    max-width:
        1000px;

    margin:
        auto;
}


header h1 {
    margin:
        0 0 10px;

    color:
        white;
}


.ticket-info {
    color:
        #b5bac1;

    line-height:
        1.6;
}


/*
=================================
MAIN
=================================
*/

main {
    max-width:
        1000px;

    margin:
        auto;

    padding:
        30px;
}


/*
=================================
MESSAGE
=================================
*/

.message {
    display:
        flex;

    gap:
        15px;

    padding:
        12px 10px;

    border-radius:
        6px;
}


.message:hover {
    background:
        #2e3035;
}


.avatar {
    width:
        42px;

    height:
        42px;

    border-radius:
        50%;

    object-fit:
        cover;

    flex-shrink:
        0;
}


.message-body {
    flex:
        1;

    min-width:
        0;
}


.message-header {
    margin-bottom:
        5px;
}


.username {
    font-weight:
        600;

    color:
        white;
}


.timestamp {
    margin-left:
        8px;

    color:
        #949ba4;

    font-size:
        12px;
}


.content {
    line-height:
        1.45;

    overflow-wrap:
        anywhere;
}


/*
=================================
ATTACHMENTS
=================================
*/

.attachment {
    margin-top:
        7px;
}


.attachment a {
    color:
        #00a8fc;

    text-decoration:
        none;
}


.attachment a:hover {
    text-decoration:
        underline;
}


/*
=================================
FOOTER
=================================
*/

footer {
    max-width:
        1000px;

    margin:
        auto;

    padding:
        20px 30px 40px;

    color:
        #949ba4;

    font-size:
        12px;
}


/*
=================================
MOBILE
=================================
*/

@media (
    max-width: 600px
) {

    header {
        padding:
            20px;
    }

    main {
        padding:
            20px 10px;
    }

    .message {
        gap:
            10px;
    }

    .avatar {
        width:
            36px;

        height:
            36px;
    }
}

</style>

</head>


<body>


<header>

    <div class="header-inner">

        <h1>
            Ticket #13
        </h1>

        <div class="ticket-info">

            <div>
                <strong>Opened By:</strong>
                1267774353689542656
            </div>

            <div>
                <strong>Team:</strong>
                support
            </div>

        </div>

    </div>

</header>


<main>

    
                    <div class="message">

                        <img
                            class="avatar"
                            src="https://cdn.discordapp.com/avatars/1555438945956012112/6ffcb9ee2c025e3b7c670f4b0ace7241.png?size=64"
                            alt="Avatar"
                        >

                        <div class="message-body">

                            <div class="message-header">

                                <span class="username">
                                    Harbour Coast RP Support
                                </span>

                                <span class="timestamp">
                                    02/10/2026, 7:35:30 pm
                                </span>

                            </div>

                            

                            

                        </div>

                    </div>
                

</main>


<footer>

    Harbour Coast Roleplay Ticket Transcript

</footer>


</body>

</html>
